<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweet Dreams Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="stage">

    <!-- Left scrolling banner -->
    <div class="vert-marquee-wrap">
      <div class="vert-marquee-track">
        <img src="./assets/banners/banner1.jpg" alt="">
        <img src="./assets/banners/banner2.jpg" alt="">
        <img src="./assets/banners/banner3.jpg" alt="">
        <img src="./assets/banners/banner4.jpg" alt="">
        <img src="./assets/banners/banner5.jpg" alt="">
        <img src="./assets/banners/banner6.jpg" alt="">
        <img src="./assets/banners/banner7.jpg" alt="">
        <img src="./assets/banners/banner8.jpg" alt="">
        <img src="./assets/banners/banner9.jpg" alt="">
        <img src="./assets/banners/banner10.jpg" alt="">
        <img src="./assets/banners/banner1.jpg" alt="">
        <img src="./assets/banners/banner2.jpg" alt="">
        <img src="./assets/banners/banner3.jpg" alt="">
        <img src="./assets/banners/banner4.jpg" alt="">
        <img src="./assets/banners/banner5.jpg" alt="">
        <img src="./assets/banners/banner6.jpg" alt="">
        <img src="./assets/banners/banner7.jpg" alt="">
        <img src="./assets/banners/banner8.jpg" alt="">
        <img src="./assets/banners/banner9.jpg" alt="">
        <img src="./assets/banners/banner10.jpg" alt="">
      </div>
    </div>

    <div class="site-frame tall">

      <!-- Top scrolling banner -->
      <div class="marquee-banner">
        <div class="marquee-track">
          <img src="./assets/banners/banner(2).jpg" alt="">
          <img src="./assets/banners/banner(3).jpg" alt="">
          <img src="./assets/banners/banner(4).jpg" alt="">
          <img src="./assets/banners/banner(5).jpg" alt="">
          <img src="./assets/banners/banner(2).jpg" alt="">
          <img src="./assets/banners/banner(3).jpg" alt="">
          <img src="./assets/banners/banner(4).jpg" alt="">
          <img src="./assets/banners/banner(5).jpg" alt="">
        </div>
      </div>

      <!-- Main menu -->
      <main class="menu-screen">
        <img src="assets/main-menu/logo2.png" alt="Sweet Dreams Arcade" class="logo">

        <div class="menu-buttons">
          <a href="catch.html" class="menu-btn" data-transition="left">Play</a>
          <a href="decorate.html" class="menu-btn" data-transition="left">Cake Decorator</a>
          <button id="guide-btn" class="menu-btn secondary">Guide</button>
        </div>
      </main>

      <!-- Guide modal -->
      <div class="guide-overlay hidden" id="guide-overlay">
        <div class="guide-box">
          <img src="assets/main-menu/guide1.png" alt="Guide" class="guide-img" id="guide-img">
          <div class="guide-nav">
            <button id="guide-prev-btn" class="guide-arrow-btn guide-prev-btn hidden" aria-label="Previous"></button>
            <button id="guide-next-btn" class="guide-arrow-btn" aria-label="Next"></button>
            <button id="guide-ok-btn" class="menu-btn hidden">OK!</button>
          </div>
        </div>
      </div>

    </div>

    <!-- Right scrolling banner -->
    <div class="vert-marquee-wrap">
      <div class="vert-marquee-track">
        <img src="./assets/banners/banner6.jpg" alt="">
        <img src="./assets/banners/banner2.jpg" alt="">
        <img src="./assets/banners/banner5.jpg" alt="">
        <img src="./assets/banners/banner1.jpg" alt="">
        <img src="./assets/banners/banner8.jpg" alt="">
        <img src="./assets/banners/banner7.jpg" alt="">
        <img src="./assets/banners/banner4.jpg" alt="">
        <img src="./assets/banners/banner10.jpg" alt="">
        <img src="./assets/banners/banner9.jpg" alt="">
        <img src="./assets/banners/banner3.jpg" alt="">
        <img src="./assets/banners/banner6.jpg" alt="">
        <img src="./assets/banners/banner2.jpg" alt="">
        <img src="./assets/banners/banner5.jpg" alt="">
        <img src="./assets/banners/banner1.jpg" alt="">
        <img src="./assets/banners/banner8.jpg" alt="">
        <img src="./assets/banners/banner7.jpg" alt="">
        <img src="./assets/banners/banner4.jpg" alt="">
        <img src="./assets/banners/banner10.jpg" alt="">
        <img src="./assets/banners/banner9.jpg" alt="">
        <img src="./assets/banners/banner3.jpg" alt="">
      </div>
    </div>

  </div>

  <script src="js/sound.js"></script>
  <script src="js/transitions.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
